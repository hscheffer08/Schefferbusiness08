<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7fb"/><stop offset="0.52" stop-color="#f4f2ff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#24324c" flood-opacity=".12"/></filter>
  </defs>
  <rect width="900" height="1600" rx="44" fill="url(#bg)"/>
  <circle cx="815" cy="92" r="80" fill="#7c3aed" opacity=".10"/>
  <circle cx="78" cy="1475" r="110" fill="#b2146b" opacity=".08"/>
  <text x="62" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#7c3aed">REVISÃO VISUAL • BIOLOGIA</text>
  <text x="62" y="145" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#111936">PCR: amplificação do DNA</text><text x="62" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">Técnica que produz milhões a bilhões de cópias de uma</text><text x="62" y="219" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">região específica de DNA em poucas horas.</text><g filter="url(#shadow)">
      <rect x="52" y="297" width="796" height="154" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="345" r="24" fill="#7c3aed"/>
    <text x="92" y="353" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">1</text>
    <text x="132" y="353" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Componentes</text><text x="76" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">DNA molde, primers, dNTPs, DNA polimerase termoestável</text><text x="76" y="426" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">(como Taq) e tampão com Mg²⁺.</text><g filter="url(#shadow)">
      <rect x="52" y="475" width="796" height="154" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="523" r="24" fill="#b2146b"/>
    <text x="92" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">2</text>
    <text x="132" y="531" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">1. Desnaturação</text><text x="76" y="573" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">94–95 °C: o calor separa as duas fitas de DNA, que passam</text><text x="76" y="604" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">a funcionar como moldes.</text><g filter="url(#shadow)">
      <rect x="52" y="653" width="796" height="154" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="701" r="24" fill="#7c3aed"/>
    <text x="92" y="709" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">3</text>
    <text x="132" y="709" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">2. Anelamento</text><text x="76" y="751" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">50–65 °C: os primers se ligam às sequências complementares</text><text x="76" y="782" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">que delimitam a região de interesse.</text><g filter="url(#shadow)">
      <rect x="52" y="831" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="879" r="24" fill="#b2146b"/>
    <text x="92" y="887" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">4</text>
    <text x="132" y="887" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">3. Extensão</text><text x="76" y="929" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">72 °C: a polimerase alonga novas fitas a partir dos</text><text x="76" y="960" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">primers. Em geral, 25–40 ciclos geram amplificação</text><text x="76" y="991" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">exponencial.</text><g filter="url(#shadow)">
      <rect x="52" y="1040" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="1088" r="24" fill="#7c3aed"/>
    <text x="92" y="1096" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">5</text>
    <text x="132" y="1096" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Aplicações</text><text x="76" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Diagnóstico molecular, medicina forense, identificação de</text><text x="76" y="1169" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">indivíduos, pesquisa de genes e mutações, biotecnologia e</text><text x="76" y="1200" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">agricultura.</text><rect x="52" y="1257" width="796" height="62" rx="20" fill="#111936"/>
  <text x="450" y="1297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Material reorganizado a partir dos visuais enviados • @cissaensina</text>
  </svg>