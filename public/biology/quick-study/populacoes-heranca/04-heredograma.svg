<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7fb"/><stop offset="0.52" stop-color="#f4f2ff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#24324c" flood-opacity=".12"/></filter>
  </defs>
  <rect width="900" height="1600" rx="44" fill="url(#bg)"/>
  <circle cx="815" cy="92" r="80" fill="#db2777" opacity=".10"/>
  <circle cx="78" cy="1475" r="110" fill="#b2146b" opacity=".08"/>
  <text x="62" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#db2777">REVISÃO VISUAL • BIOLOGIA</text>
  <text x="62" y="145" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#111936">Como analisar um heredograma</text><text x="62" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">Representação gráfica de uma característica genética em</text><text x="62" y="219" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">uma família. O objetivo é reconhecer o padrão de herança.</text><g filter="url(#shadow)">
      <rect x="52" y="297" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="345" r="24" fill="#db2777"/>
    <text x="92" y="353" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">1</text>
    <text x="132" y="353" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Símbolos básicos</text><text x="76" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Quadrado = homem; círculo = mulher; preenchido = afetado;</text><text x="76" y="426" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">meio preenchido = portador; losango = sexo não</text><text x="76" y="457" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">especificado.</text><g filter="url(#shadow)">
      <rect x="52" y="506" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="554" r="24" fill="#b2146b"/>
    <text x="92" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">2</text>
    <text x="132" y="562" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Passo a passo</text><text x="76" y="604" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Identifique afetados, compare os sexos, observe se a</text><text x="76" y="635" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">característica pula gerações e verifique se existe</text><text x="76" y="666" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">transmissão de pai para filho homem.</text><g filter="url(#shadow)">
      <rect x="52" y="715" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="763" r="24" fill="#db2777"/>
    <text x="92" y="771" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">3</text>
    <text x="132" y="771" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Autossômica</text><text x="76" y="813" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Dominante costuma aparecer em gerações sucessivas;</text><text x="76" y="844" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">recessiva pode pular gerações e surgir em filhos de pais</text><text x="76" y="875" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">não afetados portadores.</text><g filter="url(#shadow)">
      <rect x="52" y="924" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="972" r="24" fill="#b2146b"/>
    <text x="92" y="980" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">4</text>
    <text x="132" y="980" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Ligada ao X ou Y</text><text x="76" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Ligada ao X não passa de pai para filho homem. Ligada ao Y</text><text x="76" y="1053" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">aparece apenas em homens e passa do pai para todos os</text><text x="76" y="1084" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">filhos homens.</text><g filter="url(#shadow)">
      <rect x="52" y="1133" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="1181" r="24" fill="#db2777"/>
    <text x="92" y="1189" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">5</text>
    <text x="132" y="1189" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Mitocondrial</text><text x="76" y="1231" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Transmissão materna: homens afetados não transmitem.</text><text x="76" y="1262" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Mulheres com mutação podem transmitir a filhos de ambos os</text><text x="76" y="1293" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">sexos.</text><rect x="52" y="1350" width="796" height="62" rx="20" fill="#111936"/>
  <text x="450" y="1390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Material reorganizado a partir dos visuais enviados • @cissaensina</text>
  </svg>