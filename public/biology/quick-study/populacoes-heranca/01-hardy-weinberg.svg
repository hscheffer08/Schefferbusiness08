<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7fb"/><stop offset="0.52" stop-color="#f4f2ff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#24324c" flood-opacity=".12"/></filter>
  </defs>
  <rect width="900" height="1600" rx="44" fill="url(#bg)"/>
  <circle cx="815" cy="92" r="80" fill="#0f766e" opacity=".10"/>
  <circle cx="78" cy="1475" r="110" fill="#b2146b" opacity=".08"/>
  <text x="62" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#0f766e">REVISÃO VISUAL • BIOLOGIA</text>
  <text x="62" y="145" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#111936">Hardy-Weinberg</text><text x="62" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">Modelo nulo para uma população que não está evoluindo:</text><text x="62" y="219" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">frequências alélicas e genotípicas permanecem constantes</text><text x="62" y="248" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">ao longo das gerações.</text><g filter="url(#shadow)">
      <rect x="52" y="323" width="796" height="154" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="371" r="24" fill="#0f766e"/>
    <text x="92" y="379" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">1</text>
    <text x="132" y="379" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Frequências alélicas</text><text x="76" y="421" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Para dois alelos A e a: p = frequência de A, q =</text><text x="76" y="452" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">frequência de a e p + q = 1.</text><g filter="url(#shadow)">
      <rect x="52" y="501" width="796" height="123" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="549" r="24" fill="#b2146b"/>
    <text x="92" y="557" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">2</text>
    <text x="132" y="557" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Frequências genotípicas</text><text x="76" y="599" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">AA = p², Aa = 2pq e aa = q². Logo: p² + 2pq + q² = 1.</text><g filter="url(#shadow)">
      <rect x="52" y="648" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="696" r="24" fill="#0f766e"/>
    <text x="92" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">3</text>
    <text x="132" y="704" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Condições</text><text x="76" y="746" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">População muito grande, acasalamento aleatório, ausência</text><text x="76" y="777" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">de mutação, ausência de seleção natural e ausência de</text><text x="76" y="808" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">migração.</text><g filter="url(#shadow)">
      <rect x="52" y="857" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="905" r="24" fill="#b2146b"/>
    <text x="92" y="913" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">4</text>
    <text x="132" y="913" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Como interpretar</text><text x="76" y="955" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Desvios do equilíbrio sugerem atuação de forças</text><text x="76" y="986" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">evolutivas. O modelo também permite estimar frequências de</text><text x="76" y="1017" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">genótipos e portadores.</text><g filter="url(#shadow)">
      <rect x="52" y="1066" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="1114" r="24" fill="#0f766e"/>
    <text x="92" y="1122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">5</text>
    <text x="132" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Atalho de prova</text><text x="76" y="1164" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Se a frequência do fenótipo recessivo é conhecida, ela</text><text x="76" y="1195" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">corresponde a q². Tire a raiz para obter q; depois use p =</text><text x="76" y="1226" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">1 − q e calcule 2pq.</text><rect x="52" y="1283" width="796" height="62" rx="20" fill="#111936"/>
  <text x="450" y="1323" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Material reorganizado a partir dos visuais enviados • @cissaensina</text>
  </svg>