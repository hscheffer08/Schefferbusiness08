<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7fb"/><stop offset="0.52" stop-color="#f4f2ff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#24324c" flood-opacity=".12"/></filter>
  </defs>
  <rect width="900" height="1600" rx="44" fill="url(#bg)"/>
  <circle cx="815" cy="92" r="80" fill="#9333ea" opacity=".10"/>
  <circle cx="78" cy="1475" r="110" fill="#b2146b" opacity=".08"/>
  <text x="62" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#9333ea">REVISÃO VISUAL • BIOLOGIA</text>
  <text x="62" y="145" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" fill="#111936">Herança mitocondrial</text><text x="62" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">O DNA mitocondrial (mtDNA) é circular, possui 37 genes e é</text><text x="62" y="219" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#596681">herdado quase exclusivamente pela linhagem materna.</text><g filter="url(#shadow)">
      <rect x="52" y="297" width="796" height="154" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="345" r="24" fill="#9333ea"/>
    <text x="92" y="353" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">1</text>
    <text x="132" y="353" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Padrão de transmissão</text><text x="76" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">A mãe transmite mitocôndrias aos filhos e filhas; o pai</text><text x="76" y="426" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">não transmite seu mtDNA aos descendentes.</text><g filter="url(#shadow)">
      <rect x="52" y="475" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="523" r="24" fill="#b2146b"/>
    <text x="92" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">2</text>
    <text x="132" y="531" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Quem pode herdar</text><text x="76" y="573" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Filhos de uma mulher com mutação mitocondrial podem herdar</text><text x="76" y="604" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">a alteração. A gravidade pode variar entre irmãos e</text><text x="76" y="635" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">tecidos.</text><g filter="url(#shadow)">
      <rect x="52" y="684" width="796" height="185" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="732" r="24" fill="#9333ea"/>
    <text x="92" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">3</text>
    <text x="132" y="740" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Heteroplasmia</text><text x="76" y="782" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Uma célula pode conter mistura de mtDNA normal e mutante.</text><text x="76" y="813" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">O percentual de moléculas mutadas ajuda a explicar</text><text x="76" y="844" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">diferenças de sintomas.</text><g filter="url(#shadow)">
      <rect x="52" y="893" width="796" height="154" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="941" r="24" fill="#b2146b"/>
    <text x="92" y="949" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">4</text>
    <text x="132" y="949" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Tecidos mais afetados</text><text x="76" y="991" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">Músculos, cérebro, retina e outros tecidos com alta</text><text x="76" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">demanda energética costumam ser particularmente sensíveis.</text><g filter="url(#shadow)">
      <rect x="52" y="1071" width="796" height="154" rx="26" fill="#ffffff" stroke="#dce3f4" stroke-width="2"/>
    </g>
    <circle cx="92" cy="1119" r="24" fill="#9333ea"/>
    <text x="92" y="1127" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="white">5</text>
    <text x="132" y="1127" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#111936">Exemplos</text><text x="76" y="1169" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">MELAS, MERRF, LHON e NARP são exemplos clássicos de</text><text x="76" y="1200" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#465470">doenças relacionadas ao mtDNA.</text><rect x="52" y="1257" width="796" height="62" rx="20" fill="#111936"/>
  <text x="450" y="1297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Material reorganizado a partir dos visuais enviados • @cissaensina</text>
  </svg>