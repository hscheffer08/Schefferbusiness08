name: Fix professional match pagination
on:
  push:
    paths:
      - 'scripts/fix-professional-match-pagination.py'
      - '.github/workflows/fix-professional-match-pagination.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional match repair
        run: python scripts/fix-professional-match-pagination.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit professional match repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/professional-area-match.ts src/components/CommercialAreaResults.tsx scripts/validate-professional-match.mjs package.json
          git commit -m 'Fix professional match data pagination and equal scores' || exit 0
          git push
