name: Professionalize area matching

on:
  push:
    paths:
      - '.github/workflows/professionalize-area-matching.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply professional matching refactor
        run: python3 .github/scripts/professionalize_area_matching.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify database questions and professional area matching"
          git push
