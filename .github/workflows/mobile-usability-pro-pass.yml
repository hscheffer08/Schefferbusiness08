name: Mobile usability Pro pass

on:
  push:
    branches:
      - mobile-usability-pro-pass
    paths:
      - scripts/mobile-usability-pro-pass.trigger

permissions:
  contents: write

jobs:
  patch-build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-usability-pro-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply mobile usability fixes
        run: python scripts/apply-mobile-usability-pro-pass.py
      - name: Enable Vercel Speed Insights package
        run: npm install @vercel/speed-insights@latest --save
      - name: Install exact dependency tree
        run: npm ci
      - name: Validate and build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.html package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Fix mobile course usability and add Speed Insights"
            git push origin mobile-usability-pro-pass
          fi
