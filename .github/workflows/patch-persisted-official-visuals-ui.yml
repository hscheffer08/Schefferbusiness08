name: Patch persisted official visuals UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-persisted-official-visuals-ui.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch official question workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/OfficialQuestionWorkspaceV5.tsx')
          s=p.read_text()
          s=s.replace('  image_alt: string | null;\n  source_page: number | null;\n};','  image_alt: string | null;\n  source_page: number | null;\n  images?: string[] | null;\n  option_images?: Record<string, string[] | string> | null;\n};',1)
          s=s.replace('image_url,image_alt,source_page",','image_url,image_alt,source_page,images,option_images",',1)
          old='''      const visualCue = /\\b(figura|imagem|gr[aá]fico|tabela|mapa|esquema|fotografia|charge|tirinha|diagrama|cartum|quadrinho|ilustra[cç][aã]o)\\b/i.test(\n        [q.prompt_text, q.option_a, q.option_b, q.option_c, q.option_d, q.option_e]\n          .filter(Boolean)\n          .join(" "),\n      );'''
          new='''      // Visuals are now explicitly persisted in Conectae Storage. Do not infer\n      // image dependency from words such as “imagem” or “mapa” in ordinary text.\n      const persistedOptionImages = Object.fromEntries(\n        Object.entries(q.option_images || {})\n          .map(([letter, value]) => [letter, Array.isArray(value) ? value[0] : value])\n          .filter(([, value]) => typeof value === "string" && value.length > 0),\n      ) as Record<string, string>;\n      const persistedImages = Array.isArray(q.images)\n        ? q.images.filter((value): value is string => typeof value === "string" && value.length > 0)\n        : [];\n      const visualCue = Boolean(q.image_url || persistedImages.length || Object.keys(persistedOptionImages).length);'''
          if old not in s: raise SystemExit('visualCue block not found')
          s=s.replace(old,new,1)
          s=s.replace('''        images: q.image_url ? [q.image_url] : undefined,\n        // source_page antigo''','''        images: persistedImages.length ? persistedImages : q.image_url ? [q.image_url] : undefined,\n        option_images: Object.keys(persistedOptionImages).length ? persistedOptionImages : undefined,\n        // source_page antigo''',1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/components/OfficialQuestionWorkspaceV5.tsx
      - name: Commit patch
        run: |
          git config user.name 'conectae-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/OfficialQuestionWorkspaceV5.tsx
          git commit -m 'Use persisted official visual assets directly' || exit 0
          git push
