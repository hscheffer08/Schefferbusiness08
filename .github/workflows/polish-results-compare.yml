name: Polish results and compare
on:
  push:
    paths:
      - 'scripts/polish-results-compare.py'
      - '.github/workflows/polish-results-compare.yml'
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply results and compare polish
        run: python scripts/polish-results-compare.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit polished results and compare
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CommercialAreaResults.tsx src/components/Comparator.tsx
          git commit -m 'Improve confidence explanations and comparison data' || exit 0
          git push
