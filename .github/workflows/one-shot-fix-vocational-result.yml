name: One-shot fix vocational result UX

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-vocational-result.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch vocational result
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          path = 'src/components/VocationalDemoPremium.tsx'

          replace_once(
              path,
              "import { cleanReferralName } from '@/lib/free-referrals';",
              "import { cleanReferralName } from '@/lib/free-referrals';\nimport { ACADEMIC_AREAS } from '@/lib/area-match-data';"
          )

          helper = r'''
function normalizeAcademicLabel(value: string) {
  return value
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function academicAreaForCourse(course: VocationalCourse) {
  const courseName = normalizeAcademicLabel(course.name);
  return ACADEMIC_AREAS.find((area) => {
    const courses = normalizeAcademicLabel(area.courses);
    return courses.includes(courseName) || courseName.includes(courses);
  }) ?? null;
}

function matchDimensionValue(profile: Record<VocationalDimension, number>, course: VocationalCourse, dimension: VocationalDimension) {
  const userSignal = profile[dimension] ?? 50;
  const courseSignal = course.profile[dimension] ?? 50;
  const relevance = DIMENSION_WEIGHTS[dimension] ?? 1;
  const blended = (userSignal * 0.56) + (courseSignal * 0.44);
  const weighted = blended + ((relevance - 1) * 10);
  return Math.round(Math.max(38, Math.min(96, weighted)));
}

'''
          replace_once(
              path,
              "export default function VocationalDemoPremium({ onBack }: VocationalDemoProps) {",
              helper + "export default function VocationalDemoPremium({ onBack }: VocationalDemoProps) {"
          )

          replace_once(
              path,
              "  const presentation = getVocationalPresentation(top.course);\n  const topDimensions = (Object.entries(profile) as [VocationalDimension, number][]).sort((a, b) => b[1] - a[1]).slice(0, 8);",
              "  const presentation = getVocationalPresentation(top.course);\n  const matchedAcademicArea = academicAreaForCourse(top.course);\n  const topDimensions = (Object.keys(DIMENSION_LABELS) as VocationalDimension[])\n    .map((dimension) => [dimension, matchDimensionValue(profile, top.course, dimension)] as [VocationalDimension, number])\n    .sort((a, b) => b[1] - a[1])\n    .slice(0, 8);"
          )

          hero_end = '''        </section>\n\n        <div className="grid lg:grid-cols-[1.05fr_1fr] gap-6 mb-8">'''
          cta = '''        </section>\n\n        {matchedAcademicArea && (\n          <section className="mb-8 overflow-hidden rounded-[26px] border border-cyan-300/30 bg-gradient-to-r from-cyan-400/12 via-brand-500/10 to-violet-500/10 p-6 md:p-8 shadow-xl shadow-cyan-950/10">\n            <div className="flex flex-col lg:flex-row lg:items-center gap-6">\n              <div className="flex-1">\n                <div className="inline-flex items-center gap-2 text-[11px] uppercase tracking-[.15em] text-cyan-200 font-black mb-2"><GraduationCap className="w-4 h-4" /> Seu próximo passo</div>\n                <h2 className="text-2xl md:text-4xl font-black tracking-tight mb-3">Agora descubra qual faculdade combina mais com você em {top.course.name}</h2>\n                <p className="text-sm md:text-base text-ink-300 leading-relaxed max-w-3xl">Responda ao questionário específico da área e compare as faculdades por ambiente acadêmico, metodologia, carreira, prática, internacionalização e preferências pessoais.</p>\n              </div>\n              <button\n                type="button"\n                onClick={() => {\n                  trackEvent('vocational_college_match_cta_clicked', { course: top.course.name, area_id: matchedAcademicArea.id });\n                  window.dispatchEvent(new CustomEvent('conectae:close-vocational'));\n                  window.dispatchEvent(new CustomEvent('conectae:open-area-match', { detail: { areaId: matchedAcademicArea.id } }));\n                }}\n                className="shrink-0 inline-flex items-center justify-center gap-2 rounded-2xl bg-cyan-300 hover:brightness-110 text-[#06131c] font-black px-6 py-4 shadow-lg shadow-cyan-950/20 transition-all hover:scale-[1.02] active:scale-95"\n              >\n                Encontrar minha faculdade <ArrowRight className="w-5 h-5" />\n              </button>\n            </div>\n          </section>\n        )}\n\n        <div className="grid lg:grid-cols-[1.05fr_1fr] gap-6 mb-8">'''
          replace_once(path, hero_end, cta)

          replace_once(
              path,
              '<h2 className="text-xl font-bold">Dimensões que mais pesaram</h2>',
              '<h2 className="text-xl font-bold">Dimensões que mais influenciaram seu match</h2>'
          )

          main_path = Path('src/main.tsx')
          main_text = main_path.read_text()
          main_text = main_text.replace("import VocationalFollowupMount from './lib/vocational-followup-mount.tsx';\n", '')
          main_text = main_text.replace('    <VocationalFollowupMount />\n', '')
          main_path.write_text(main_text)

          Path('.github/workflows/one-shot-fix-vocational-result.yml').unlink()
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VocationalDemoPremium.tsx src/main.tsx .github/workflows/one-shot-fix-vocational-result.yml
          git commit -m "Fix vocational CTA and match dimension visualization"
          git push