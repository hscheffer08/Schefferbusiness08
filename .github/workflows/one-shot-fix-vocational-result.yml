name: Apply vocational result fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-vocational-result.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_vocational_result.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-fix-vocational-result.yml
          rm .github/scripts/fix_vocational_result.py
          git add -A
          git commit -m "Fix vocational CTA and match dimensions"
          git push