name: Prevent repeated practice questions
on:
  push:
    paths:
      - 'scripts/prevent-repeat-practice-questions.trigger'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply per-account question history
        run: python scripts/prevent-repeat-practice-questions.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Lint study lab
        run: npx eslint src/components/PlannerStudyLab.tsx
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PlannerStudyLab.tsx
          git commit -m 'Prevent repeated practice questions per account' || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
