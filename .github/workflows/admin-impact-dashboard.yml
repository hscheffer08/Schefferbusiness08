name: Wire admin impact dashboard

on:
  push:
    branches:
      - admin-impact-dashboard

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-impact-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch Admin panel
        run: python scripts/patch-admin-impact.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Admin.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Integrate admin impact dashboard"
            git push origin admin-impact-dashboard
          fi
