name: Improve weekly plan
on:
  push:
    paths:
      - 'scripts/improve-weekly-plan.trigger'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Integrate enhanced weekly plan
        run: python scripts/improve-weekly-plan.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Lint weekly plan files
        run: npx eslint src/components/WeeklyPlanExperience.tsx src/components/AdmissionsPlannerV11.tsx src/lib/admissions-roadmap.ts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdmissionsPlannerV11.tsx
          git commit -m 'Integrate enhanced weekly plan experience' || exit 0
          git push
