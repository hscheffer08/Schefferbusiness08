name: Upgrade questionnaires V2
on:
  push:
    paths:
      - 'scripts/upgrade-questionnaires-v2.trigger'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply questionnaire V2 patch
        run: python3 scripts/upgrade-questionnaires-v2.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/vocational-data.ts src/components/VocationalDemoPremium.tsx
          git commit -m 'Deepen vocational assessment with trade-off questions' || exit 0
          git push
