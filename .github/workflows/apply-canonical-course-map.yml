name: Apply canonical course map

on:
  push:
    paths:
      - '.github/workflows/apply-canonical-course-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch vocational CTA routing
        run: python3 .github/scripts/apply_canonical_course_map.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use canonical 50-course routing for college questionnaires"
          git push
