name: Apply adaptive area matching
on:
  push:
    paths:
      - 'scripts/apply-adaptive-area-match.trigger'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Apply adaptive matching patch
        run: python scripts/apply-adaptive-area-match.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AreaMatchPortal.tsx
          git commit -m 'Enable adaptive learning in college matching' || exit 0
          git push
