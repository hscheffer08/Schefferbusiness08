name: Controlled toolchain upgrade
on:
  push:
    paths:
      - 'scripts/toolchain-upgrade.trigger'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install current dependencies
        run: npm ci
      - name: Upgrade Vite toolchain
        run: npm install --save-dev vite@^8.2.2 @vitejs/plugin-react@latest
      - name: Apply remaining non-breaking fixes
        run: npm audit fix || true
      - name: Validate catalog, types and production build
        run: npm run build
      - name: Check remaining vulnerabilities
        run: npm audit --audit-level=high
      - name: Commit validated toolchain upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Upgrade Vite toolchain and clear dependency audit' || exit 0
          git push
