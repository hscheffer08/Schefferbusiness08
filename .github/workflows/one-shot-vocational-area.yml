name: One-shot vocational area integration

on:
  push:
    paths:
      - '.github/workflows/one-shot-vocational-area.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch vocational result flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Screen type
          replace_once(
              'src/types.ts',
              "  | 'faculty-questionnaire'\n  | 'vocational-demo'",
              "  | 'faculty-questionnaire'\n  | 'vocational-demo'\n  | 'area-match'"
          )

          # App imports
          replace_once(
              'src/App.tsx',
              "import FacultyQuestionnaireHub from '@/components/FacultyQuestionnaireHub';",
              "import FacultyQuestionnaireHub from '@/components/FacultyQuestionnaireHub';\nimport VocationalDemoPremium from '@/components/VocationalDemoPremium';\nimport AreaMatchPortal from '@/components/AreaMatchPortal';"
          )

          # App state
          replace_once(
              'src/App.tsx',
              "  const [referrerId, setReferrerId] = useState<string | null>(null);",
              "  const [referrerId, setReferrerId] = useState<string | null>(null);\n  const [selectedAreaId, setSelectedAreaId] = useState<string | null>(null);"
          )

          # App handler
          replace_once(
              'src/App.tsx',
              "  const handleOnboardingComplete = async () => {",
              "  const handleOpenAreaQuestionnaire = (areaId: string) => {\n    setSelectedAreaId(areaId);\n    setScreen('area-match');\n    trackEvent('vocational_area_match_opened', { area_id: areaId }, user?.id);\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  };\n\n  const handleOnboardingComplete = async () => {"
          )

          # App routes
          replace_once(
              'src/App.tsx',
              "  if (screen === 'faculty-questionnaire') {",
              "  if (screen === 'vocational-demo')\n    return <VocationalDemoPremium onBack={handleBackToHome} onOpenCollegeMatch={handleOpenAreaQuestionnaire} />;\n\n  if (screen === 'area-match')\n    return <AreaMatchPortal initialAreaId={selectedAreaId} onClose={handleBackToHome} />;\n\n  if (screen === 'faculty-questionnaire') {"
          )

          # Vocational imports and prop
          replace_once(
              'src/components/VocationalDemoPremium.tsx',
              "import { cleanReferralName } from '@/lib/free-referrals';",
              "import { cleanReferralName } from '@/lib/free-referrals';\nimport { ACADEMIC_AREAS } from '@/lib/area-match-data';"
          )
          replace_once(
              'src/components/VocationalDemoPremium.tsx',
              "interface VocationalDemoProps { onBack: () => void }",
              "interface VocationalDemoProps { onBack: () => void; onOpenCollegeMatch: (areaId: string) => void }"
          )

          resolver = r'''
function normalizeCourseName(value: string) {
  return value
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function findAcademicAreaForCourse(course: VocationalCourse) {
  const courseName = normalizeCourseName(course.name);
  const courseArea = normalizeCourseName(course.area);

  return ACADEMIC_AREAS.find((area) => {
    const areaCourses = normalizeCourseName(area.courses);
    return areaCourses.includes(courseName) || courseName.includes(areaCourses);
  }) ?? ACADEMIC_AREAS.find((area) => normalizeCourseName(area.name) === courseArea) ?? null;
}

'''
          replace_once(
              'src/components/VocationalDemoPremium.tsx',
              "export default function VocationalDemoPremium({ onBack }: VocationalDemoProps) {",
              resolver + "export default function VocationalDemoPremium({ onBack, onOpenCollegeMatch }: VocationalDemoProps) {"
          )

          # CTA variables
          replace_once(
              'src/components/VocationalDemoPremium.tsx',
              "  const top = ranking[0];",
              "  const top = ranking[0];\n  const matchedAcademicArea = findAcademicAreaForCourse(top.course);"
          )

          # CTA card before university suggestions
          marker = '        <section className="mb-10">\n          <div className="flex flex-col md:flex-row md:items-end justify-between gap-3 mb-5"><div><div className="inline-flex items-center gap-2 text-xs uppercase tracking-widest text-brand-300 font-bold mb-2"><GraduationCap className="w-4 h-4" /> Onde pesquisar</div><h2 className="text-2xl md:text-3xl font-bold">Faculdades fortes para {top.course.name}</h2></div>'
          cta = '''        {matchedAcademicArea && (
          <section className="mb-10 overflow-hidden rounded-3xl border border-cyan-300/25 bg-gradient-to-r from-cyan-400/10 via-brand-500/10 to-violet-500/10 p-6 md:p-8">
            <div className="flex flex-col lg:flex-row lg:items-center gap-6">
              <div className="flex-1">
                <div className="inline-flex items-center gap-2 text-xs uppercase tracking-widest text-cyan-200 font-bold mb-3"><GraduationCap className="w-4 h-4" /> Seu próximo passo</div>
                <h2 className="text-2xl md:text-4xl font-black tracking-tight mb-3">Agora descubra qual faculdade é ideal para {top.course.name}</h2>
                <p className="text-sm md:text-base text-ink-300 leading-relaxed max-w-2xl">Seu curso já está definido. Responda ao questionário específico de <strong className="text-white">{matchedAcademicArea.name}</strong> e compare as faculdades dessa área pelo seu perfil, ambiente, objetivos e preferências.</p>
              </div>
              <button
                type="button"
                onClick={() => {
                  trackEvent('vocational_college_match_cta_clicked', { course: top.course.name, area_id: matchedAcademicArea.id });
                  onOpenCollegeMatch(matchedAcademicArea.id);
                }}
                className="shrink-0 inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-cyan-300 to-brand-400 px-6 py-4 font-black text-[#06131c] shadow-xl shadow-cyan-500/10 transition-all hover:scale-[1.02] active:scale-95"
              >
                Encontrar minha faculdade <ArrowRight className="w-5 h-5" />
              </button>
            </div>
          </section>
        )}

'''
          p = Path('src/components/VocationalDemoPremium.tsx')
          text = p.read_text()
          if marker not in text:
              raise SystemExit('University section marker not found')
          p.write_text(text.replace(marker, cta + marker, 1))

          # Remove this one-shot workflow so it does not remain in the repository.
          Path('.github/workflows/one-shot-vocational-area.yml').unlink()
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts src/components/VocationalDemoPremium.tsx .github/workflows/one-shot-vocational-area.yml
          git commit -m "Connect vocational results to area college questionnaire"
          git push
