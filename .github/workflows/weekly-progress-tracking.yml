name: Weekly progress tracking
on:
  push:
    paths:
      - 'scripts/weekly-progress-tracking.trigger'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Integrate progress tracking
        run: python scripts/apply-weekly-progress-tracking.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Lint changed files
        run: npx eslint src/components/WeeklyPlanExperience.tsx src/components/AdmissionsPlannerV11.tsx
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdmissionsPlannerV11.tsx
          git commit -m 'Integrate weekly mission progress' || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
