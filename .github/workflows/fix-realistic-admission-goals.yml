name: Fix realistic admission goals
on:
  push:
    paths:
      - 'scripts/fix-realistic-admission-goals.trigger'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch data-based goals
        run: python scripts/fix-realistic-admission-goals.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdmissionsPlannerV11.tsx
          git commit -m 'Use realistic course-specific admission goals' || exit 0
          git push
