name: Continuous percentage scale
on:
  push:
    paths:
      - 'scripts/continuous-percent-scale.py'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply continuous percentage upgrade
        run: python scripts/continuous-percent-scale.py
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Commit continuous percentage upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AreaMatchPortal.tsx src/lib/professional-area-match.ts src/lib/adaptive-area-match.ts src/components/CommercialAreaResults.tsx src/components/Quiz.tsx scripts/validate-questionnaires.mjs scripts/validate-professional-match.mjs
          git commit -m 'Enable continuous 0-100 matching inputs' || exit 0
          git push
