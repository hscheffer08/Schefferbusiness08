name: Materialize all official visuals

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-all-official-visuals.mjs'
      - '.github/workflows/materialize-all-official-visuals.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materialize-all-official-visuals
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://kmognvgnfisdchzffkgh.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CONNECTAE_APP_URL: https://xn--conecta-pya.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Persist every visual asset into Conectae Storage
        run: node scripts/materialize-all-official-visuals.mjs
